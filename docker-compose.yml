services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?isi MYSQL_ROOT_PASSWORD di .env}
      MYSQL_DATABASE: ${DB_NAME:-absensi}
      MYSQL_USER: ${DB_USER:-absensi}
      MYSQL_PASSWORD: ${DB_PASS:?isi DB_PASS di .env}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      # hanya bisa diakses dari mesin ini (localhost), tidak terbuka ke jaringan
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-absensi}
      DB_PASS: ${DB_PASS:?isi DB_PASS di .env}
      DB_NAME: ${DB_NAME:-absensi}
      SECRET_KEY: ${SECRET_KEY:?isi SECRET_KEY di .env}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "${WEB_PORT:-8080}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
